<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>TaskContext 场景测试页</title>
</head>
<body>
  <div id="loading-mask" style="position:fixed;inset:0;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center">加载中...</div>
  <button id="nav-btn" style="width:150px;height:40px">去面板</button>
  <button id="api-btn" style="width:150px;height:40px">拉取数据</button>
  <div id="api-result"></div>
  <script>
    window.__APP_STATE__ = { ok: true, user: 't1' }

    document.getElementById('nav-btn').addEventListener('click', () => {
      setTimeout(() => { location.hash = '#/dashboard' }, 2000)
    })

    document.getElementById('api-btn').addEventListener('click', () => {
      fetch('/api/delay').then(r => r.json()).then(data => {
        document.getElementById('api-result').textContent = 'done'
      })
    })

    setTimeout(() => {
      const el = document.createElement('div')
      el.id = 'checkin-text'
      el.textContent = '已签到成功'
      document.body.appendChild(el)
    }, 3000)

    setTimeout(() => {
      document.getElementById('loading-mask').remove()
    }, 3000)
  </script>
</body>
</html>
