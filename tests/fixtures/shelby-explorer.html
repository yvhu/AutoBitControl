<!doctype html>
<html lang="en">
<body>
  <header>
    <button id="connect">Connect Wallet</button>
  </header>
  <div id="wallet-modal" role="dialog" style="display:none">
    <button id="dialog-connect">Connect</button>
  </div>
  <div id="account-section">
    <button id="upload-files">Upload Files</button>
  </div>
  <div id="upload-dialog" role="dialog" style="display:none">
    <input type="file" />
    <button id="upload" disabled>Upload</button>
    <div id="status"></div>
  </div>
  <script>
    // alreadydone 查询参数只出现在首次导航（meta.url），账号页 goto 会丢掉它：
    // 用 sessionStorage 把「已上传」标记保持到同一标签页的后续导航
    if (new URLSearchParams(location.search).has('alreadydone')) sessionStorage.setItem('alreadydone', '1')
    document.getElementById('connect').addEventListener('click', () => {
      document.getElementById('wallet-modal').style.display = 'block'
    })
    document.getElementById('dialog-connect').addEventListener('click', () => {
      document.getElementById('connect').textContent = '0x1234567890abcdef'
      document.getElementById('wallet-modal').style.display = 'none'
    })
    document.getElementById('upload-files').addEventListener('click', () => {
      document.getElementById('upload-dialog').style.display = 'block'
    })
    document.querySelector('#upload-dialog input[type="file"]').addEventListener('change', () => {
      // 真机行为（2026-09-07 核实）：已上传文件在选文件后立即显示查重错误，
      // Upload 按钮保持禁用（永不启用）；未上传文件才启用 Upload
      if (sessionStorage.getItem('alreadydone') === '1') {
        document.getElementById('status').textContent = 'Error: Blob name already taken'
        return
      }
      document.getElementById('upload').disabled = false
    })
    document.getElementById('upload').addEventListener('click', () => {
      const status = document.getElementById('status')
      if (new URLSearchParams(location.search).has('alreadydone') || sessionStorage.getItem('alreadydone') === '1') {
        status.textContent = 'Error: Blob name already taken'
        return
      }
      status.textContent = 'Uploading files…'
      setTimeout(() => {
        status.textContent = 'All files uploaded successfully'
      }, 500)
    })
  </script>
</body>
</html>
